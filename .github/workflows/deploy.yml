name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # BASE_PATH is empty once a custom domain is set (static/CNAME).
      # Until then the site lives at /<repo>/ on github.io, and every
      # root-relative link needs that prefix or the CSS 404s.
      - name: Build
        run: python3 build.py --base "${BASE_PATH}"
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Check SEO
        run: python3 tools/seo_check.py --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
